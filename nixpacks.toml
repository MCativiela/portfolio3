[variables]
    NIXPACKS_PHP_VERSION = "8.4"
    NIXPACKS_NODE_VERSION = "20"
    NODE_ENV = "production"

[phases.build]
    cmds = [
        "composer install --no-dev --optimize-autoloader --no-interaction",
        "npm install",
        "npm run build"
    ]

[phases.deploy]
    cmds = [
        "php artisan migrate --force",
        "php artisan serve --host 0.0.0.0 --port ${PORT}"
    ]
